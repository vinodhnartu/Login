<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f6f8;
      }

      .login-box {
        width: 360px;
        padding: 35px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      }

      .login-box h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #222;
      }

      .input-group {
        margin-bottom: 18px;
      }

      .input-group label {
        display: block;
        margin-bottom: 7px;
        color: #555;
        font-size: 14px;
      }

      .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
        outline: none;
      }

      .input-group input:focus {
        border-color: #2563eb;
      }

      .login-btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      .login-btn:hover {
        background: #1d4ed8;
      }

      .forgot-password {
        text-align: right;
        margin-bottom: 20px;
      }

      .forgot-password a,
      .signup a {
        color: #2563eb;
        text-decoration: none;
      }

      .forgot-password a:hover,
      .signup a:hover {
        text-decoration: underline;
      }

      .signup {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #555;
      }
    </style>
  </head>

  <body>
    <div class="login-box">
      <h2>Login</h2>

      <form action="/login" method="POST">
        <div class="input-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>

        <div class="forgot-password">
          <a href="/forgot-password">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn">Login</button>

        <div class="signup">
          Don't have an account?
          <a href="/signup">Sign up</a>
        </div>
      </form>
    </div>
  </body>
</html>
